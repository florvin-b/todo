name: .NET Publish and Zip (Manual Run)

on:
  workflow_dispatch:

env:
  PUBLISH_DIR: "C:/MyBuilds/build-output"
  ZIP_OUTPUT_DIR: "C:/MyBuilds/archives"
  ZIP_FILE_NAME: "dotnet-app.zip"

jobs:
  build-and-archive:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check .NET
        run: |
          whoami
          dotnet --info
          dotnet --list-sdks

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish .NET Application
        run: |
          dotnet publish `
            --configuration Release `
            --output "${{ env.PUBLISH_DIR }}"

      - name: Create Zip Directory
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ env.ZIP_OUTPUT_DIR }}"

      - name: Compress Published Application
        run: |
          Compress-Archive `
            -Path "${{ env.PUBLISH_DIR }}\*" `
            -DestinationPath "${{ env.ZIP_OUTPUT_DIR }}\${{ env.ZIP_FILE_NAME }}" `
            -Force

      - name: Show Output
        run: |
          Write-Host "Published files:"
          Get-ChildItem "${{ env.PUBLISH_DIR }}"

          Write-Host ""
          Write-Host "ZIP file:"
          Get-Item "${{ env.ZIP_OUTPUT_DIR }}\${{ env.ZIP_FILE_NAME }}"
