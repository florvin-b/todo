name: .NET Publish and Zip

on:
  workflow_dispatch:

env:
  PUBLISH_DIR: "C:/MyBuilds/publish"
  ZIP_DIR: "C:/MyBuilds/archives"

jobs:
  build-and-archive:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check .NET
        run: dotnet --info

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish .NET Application
        run: dotnet publish -c Release -o $env:PUBLISH_DIR

      - name: Create ZIP Directory
        run: New-Item -ItemType Directory -Force -Path $env:ZIP_DIR

      - name: Create Timestamp
        shell: powershell
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd-HHmmss"
          "ZIP_TIMESTAMP=$timestamp" >> $env:GITHUB_ENV

      - name: Zip Published Files
        shell: powershell
        run: |
          $zipFile = "$env:ZIP_DIR\dotnet-app-$env:ZIP_TIMESTAMP.zip"

          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath $zipFile `
            -Force

          Write-Host "Created ZIP:"
          Write-Host $zipFile

      - name: Remove Old ZIP Archives
        shell: powershell
        run: |
          $zipFiles = Get-ChildItem `
            -Path $env:ZIP_DIR `
            -Filter "dotnet-app-*.zip" `
            -File |
            Sort-Object LastWriteTime -Descending

          if ($zipFiles.Count -gt 5) {
              $zipFiles |
                Select-Object -Skip 5 |
                Remove-Item -Force
          }

      - name: Show Output
        shell: powershell
        run: |
          Write-Host "Publish folder:"
          Get-ChildItem $env:PUBLISH_DIR

          Write-Host ""
          Write-Host "ZIP archives:"
          Get-ChildItem $env:ZIP_DIR -Filter "dotnet-app-*.zip" |
            Sort-Object LastWriteTime -Descending
